name: Publish to Maven Central

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Require tag to match pom version
        run: |
          version=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          print(root.findtext("{http://maven.apache.org/POM/4.0.0}version") or "")
          PY
          )
          if [ -z "$version" ]; then
            echo "::error::Could not read project version from pom.xml"
            exit 1
          fi
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pom version '$version'."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::Refusing to publish SNAPSHOT version '$version'."
              exit 1
              ;;
          esac

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish
        run: ./mvnw -B deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
